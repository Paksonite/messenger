name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: scripts/build.sh

      # Pushes and same-repository PRs get the secrets and exercise the release signing path;
      # forks don't, and sign.sh falls back to ad-hoc signing.
      - name: Sign and package
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          scripts/sign.sh
          scripts/package.sh
