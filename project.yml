name: Messenger
options:
  bundleIdPrefix: pl.paksonite
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Messenger:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Messenger
        PRODUCT_BUNDLE_IDENTIFIER: pl.paksonite.messenger
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Messenger.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - MessengerTests
  MessengerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "js/**"
    dependencies:
      - target: Messenger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.paksonite.messenger.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
